name: Deploy Mundo do Cafe
on:
  push:
    branches:
      - main
    paths:
      - 'projeto-cafe/**'
      - '.github/workflows/deploy-cafe.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload the cafe site
        uses: actions/upload-pages-artifact@v4
        with:
          path: projeto-cafe

      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4