<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML , podemos inserir os elementos da lista a seguir. Passe o mouse sobre os ternmos para descobrir qual tag deverá utilizar em cada caso</p>
    <ul>
        <li title="Use a tag <p>">Parágrafo</li>
        <li title="Use a tag <h1..h6>">Titulo</li>
        <li title="Use a tag <img>">Imagens</li>
        <li title="Use a tag <abbr>">Abreviações</li>
        <li title="Use a tag <code>">Código-Fonte</li>
        <li title="Use a tag <ol> e <li>">Listas númericas</li>
        <li title="Use a tag <ul> e <li> ">Listas com demarcadores</li>
    </ul>
</body>
</html>
